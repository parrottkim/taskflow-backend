name: CI/CD Workflow for TaskFlow Backend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_DEV: dantechhjkim/backend-dev
      IMAGE_PROD: dantechhjkim/backend-prod
      REMOTE_DIR: 'D:/01-Projects/taskflow/backend'

    outputs:
      env: ${{ steps.set_env.outputs.env }}
      service: ${{ steps.set_env.outputs.service }}
      compose_file: ${{ steps.set_env.outputs.compose_file }}
      remote: ${{ steps.set_env.outputs.remote }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set deployment environment and outputs
        id: set_env
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}

          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "IMAGE_NAME=${IMAGE_DEV}" >> "$GITHUB_ENV"
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "service=backend-dev" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_NAME=${IMAGE_PROD}" >> "$GITHUB_ENV"
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "service=backend-prod" >> "$GITHUB_OUTPUT"
          fi

          echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
          echo "remote=${REMOTE_DIR}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push Docker image
        run: |
          docker build --build-arg NODE_ENV=${{ steps.set_env.outputs.env }} -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Transfer docker-compose.yml to Windows host
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ${{ steps.set_env.outputs.compose_file }}
          target: ${{ env.REMOTE_DIR }}

  deploy:
    needs: build
    runs-on: [self-hosted, windows, taskflow-backend]

    env:
      ENV: ${{ needs.build.outputs.env }}
      REMOTE_DIR: ${{ needs.build.outputs.remote }}
      COMPOSE_SERVICE: ${{ needs.build.outputs.service }}
      COMPOSE_FILE: ${{ needs.build.outputs.compose_file }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create ENV and SFTP key files
        shell: powershell
        run: |
          $Env = "${{ env.ENV }}"
          $RemoteDir = "${{ env.REMOTE_DIR }}"
          Set-Location -Path $RemoteDir

          $GoogleCalendarFile = "google-calendar.json"
          $EnvFile = ".prod.env"
          $SftpFile = "sftpuser_id_rsa"
          $KeyContent = '${{ secrets.PROD_SFTP_SSH_KEY }}' # 작은따옴표로 감싸 변수 할당
          $EnvContent = "${{ secrets.PROD_ENV }}"
          $GoogleCalendarSecret = '${{ secrets.GOOGLE_CALENDAR_JSON_KEY }}' # 작은따옴표로 감싸 변수 할당

          if ($Env -eq "dev") {
              $EnvFile = ".dev.env"
              $SftpFile = "sftpuser-dev_id_rsa"
              $KeyContent = '${{ secrets.DEV_SFTP_SSH_KEY }}' # 작은따옴표로 감싸 변수 할당
              $EnvContent = "${{ secrets.DEV_ENV }}"
          }

          $EnvFilePath = Join-Path $RemoteDir $EnvFile
          $SftpFilePath = Join-Path $RemoteDir $SftpFile
          $GoogleCalendarFilePath = Join-Path $RemoteDir $GoogleCalendarFile

          # 1. ENV 파일 작성
          Set-Content -Path $EnvFilePath -Value $EnvContent -Force

          # 2. SFTP SSH Key 파일 작성 (다중 줄 Secret)
          # $KeyContent 변수는 이미 리터럴 문자열로 할당되었으므로 안전하게 사용 가능
          Set-Content -Path $SftpFilePath -Value $KeyContent -Force

          # 3. Google Calendar JSON Key 파일 작성 (다중 줄 Secret)
          # $GoogleCalendarSecret 변수는 이미 리터럴 문자열로 할당되었으므로 안전하게 사용 가능
          Set-Content -Path $GoogleCalendarFilePath -Value $GoogleCalendarSecret -Force

          # 4. 권한 설정
          icacls $SftpFilePath /inheritance:r /grant:r "${{ secrets.SERVER_USER }}:F"

      - name: Deploy service
        shell: powershell
        env:
          DEV_MIGRATION_PASSWORD: ${{ secrets.DEV_MIGRATION_PASSWORD }}
          PROD_MIGRATION_PASSWORD: ${{ secrets.PROD_MIGRATION_PASSWORD }}
        run: |
          $Env = "${{ env.ENV }}"
          $RemoteDir = "${{ env.REMOTE_DIR }}"
          $Service = "${{ env.COMPOSE_SERVICE }}"
          $ComposeFile = "${{ env.COMPOSE_FILE }}"
          $MigrationUser = "migration"

          Set-Location -Path $RemoteDir

          if ($Env -eq "dev") {
              $EnvFile = ".dev.env"
              $SftpFile = "sftpuser-dev_id_rsa"
              $MigrationPassword = $env:DEV_MIGRATION_PASSWORD
          } else {
              $EnvFile = ".prod.env"
              $SftpFile = "sftpuser_id_rsa"
              $MigrationPassword = $env:PROD_MIGRATION_PASSWORD
          }

          if ([string]::IsNullOrWhiteSpace($MigrationPassword)) {
              throw "Migration database password is not configured for the $Env environment."
          }

          $EnvFilePath = Join-Path $RemoteDir $EnvFile
          $SftpFilePath = Join-Path $RemoteDir $SftpFile

          Write-Host "Pulling latest image..."
          docker compose -f $ComposeFile --profile $Env pull $Service

          Write-Host "Bringing up service..."
          docker compose -f $ComposeFile --profile $Env up -d $Service doc-converter redis

          Write-Host "Running migrations..."
          $env:POSTGRES_USER = $MigrationUser
          $env:POSTGRES_PASSWORD = $MigrationPassword

          try {
              docker compose -f $ComposeFile --profile $Env run --rm `
                  -e POSTGRES_USER `
                  -e POSTGRES_PASSWORD `
                  $Service npm run typeorm:migrate

              if ($LASTEXITCODE -ne 0) {
                  throw "Database migration failed with exit code $LASTEXITCODE."
              }
          } finally {
              Remove-Item Env:POSTGRES_USER -ErrorAction SilentlyContinue
              Remove-Item Env:POSTGRES_PASSWORD -ErrorAction SilentlyContinue
          }
